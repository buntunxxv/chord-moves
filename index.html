<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No zooming, pinch or on-focus: see src/utils/lockZoom.js for the parts
         a meta tag cannot reach on iOS or desktop. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!-- Title, description, link previews, manifest and Home Screen name
         are rendered from src/app/siteMeta.js by vite.config.js: this page
         gets the Kynda Learning Tools ones, dist/chordmoves.html (served for
         /chordmoves/*) gets Chord Moves'. Link previews never run
         JavaScript, so they have to be in the HTML the server sends. -->
    <!-- site-meta:start -->
    <!-- site-meta:end -->

    <!-- The .ico carries 16/32/48 so each browser picks its own size instead
         of downsampling one bitmap; the PNG is what modern browsers prefer.
         Both are the Kynda mark on a white disc with transparent corners, so
         it sits on a light or dark tab strip without a white box around it. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />

    <!-- Home screen. iOS reads apple-touch-icon and the apple-* meta tags,
         not the manifest; Android reads the manifest (both in site-meta). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#119392" />

    <!-- Tell the browser this page draws its own light AND dark theme.
         Without it, Android browsers that "force dark" every site
         (DuckDuckGo, Samsung Internet, in-app WebViews, Chrome's
         auto-dark flag) run their own colour inversion on top of ours,
         which can leave text dark-on-dark and unreadable. The script
         below then pins the exact scheme before first paint. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // Mirrors src/hooks/useTheme.js (same storage key and rules) so the
      // right theme is on <html> before any CSS paints -- no light flash,
      // and the browser knows which scheme we chose before it decides
      // whether to darken the page itself. Storage can throw (blocked site
      // data, some private modes), so every read is guarded.
      (function () {
        var pref = 'system'
        try {
          var stored = localStorage.getItem('chordMovesThemePreference')
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored
        } catch (e) {}
        var dark = pref === 'dark' ||
          (pref === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Lora:ital,wght@1,400;1,600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
