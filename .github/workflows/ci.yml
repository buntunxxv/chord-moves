name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04 (Nov 2026), where Playwright
    # 1.56 can't install Chromium, so the browser checks below can't run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Forced-dark and blocked-storage rendering on every route; see the
      # header of scripts/verify-theme-rendering.mjs for what it proves.
      - run: npm run test:themes
      # Plays the live demo (/demo) end to end at phone, tablet and desktop
      # sizes; a UI change that breaks a demo step fails here, naming it.
      - run: npm run test:demo
      # Rhythm Dice: renders 64 bars at 160 BPM through the lookahead
      # scheduler offline and checks every click is within +/-2 ms of the grid.
      - run: npm run test:clicks
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-check-screenshots
          path: theme-check-output/
          if-no-files-found: ignore
